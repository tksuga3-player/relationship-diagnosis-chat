<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="robots" content="index, follow">

  <title>恋愛の4フェーズ診断</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #202124;
      font-family:
        Arial,
        "Noto Sans JP",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
    }

    button,
    textarea {
      font-family: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 12vh 0 80px;
    }

    /* ========================================
       ヘッダー
    ======================================== */

    .hero {
      text-align: center;
    }

    .title {
      margin: 0;
      font-size: clamp(30px, 5vw, 46px);
      line-height: 1.35;
      letter-spacing: 0.02em;
      font-weight: 700;
    }

    .subtitle {
      margin: 16px 0 32px;
      color: #5f6368;
      font-size: 15px;
      line-height: 1.8;
    }

    /* ========================================
       Google検索風入力欄
    ======================================== */

    .search-shell {
      position: relative;
      width: min(100%, 760px);
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #dfe1e5;
      border-radius: 28px;
      box-shadow:
        0 1px 6px rgba(32, 33, 36, 0.20);
      transition:
        border-radius 0.25s ease,
        box-shadow 0.25s ease;
    }

    .search-shell:hover,
    .search-shell:focus-within {
      box-shadow:
        0 1px 8px rgba(32, 33, 36, 0.28);
    }

    .search-shell.expanded {
      border-radius: 22px;
    }

    .search-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 8px 8px 8px 20px;
    }

    .search-icon {
      flex: 0 0 auto;
      width: 22px;
      margin-top: 9px;
      color: #5f6368;
    }

    .search-icon svg {
      display: block;
      width: 22px;
      height: 22px;
    }

    #question {
      display: block;
      flex: 1;
      width: 100%;
      height: 42px;
      min-height: 42px;
      max-height: 340px;
      padding: 9px 4px 8px;
      border: 0;
      outline: 0;
      background: transparent;
      color: #202124;
      font-size: 16px;
      line-height: 1.75;
      resize: none;
      overflow-y: hidden;
      transition:
        height 0.25s ease,
        min-height 0.25s ease;
    }

    #question::placeholder {
      color: #9aa0a6;
      opacity: 1;
    }

    .search-shell.expanded #question {
      min-height: 170px;
    }

    .submit-button {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #202124;
      color: #ffffff;
      cursor: pointer;
      transition:
        opacity 0.2s ease,
        transform 0.2s ease,
        background 0.2s ease;
    }

    .submit-button:hover {
      background: #000000;
      transform: scale(1.03);
    }

    .submit-button:disabled {
      cursor: default;
      opacity: 0.45;
      transform: none;
    }

    .submit-button svg {
      width: 21px;
      height: 21px;
    }

    .submit-label {
      margin-top: 14px;
      color: #80868b;
      font-size: 12px;
      line-height: 1.7;
    }

    .privacy-note {
      margin-top: 7px;
      color: #9aa0a6;
      font-size: 11px;
      line-height: 1.7;
    }

    /* ========================================
       診断中
    ======================================== */

    .loading {
      display: none;
      margin: 42px auto 0;
      text-align: center;
    }

    .loading.visible {
      display: block;
    }

    .loading-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .loading-dots span {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #5f6368;
      animation: pulse 1.2s infinite ease-in-out;
    }

    .loading-dots span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .loading-dots span:nth-child(3) {
      animation-delay: 0.30s;
    }

    .loading-text {
      color: #5f6368;
      font-size: 14px;
      line-height: 1.7;
    }

    @keyframes pulse {
      0%,
      80%,
      100% {
        opacity: 0.3;
        transform: scale(0.8);
      }

      40% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* ========================================
       結果全体
    ======================================== */

    .result-area {
      display: none;
      width: min(100%, 820px);
      margin: 44px auto 0;
    }

    .result-area.visible {
      display: block;
    }

    .complete-message {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding: 15px 18px;
      border-radius: 14px;
      background: #e6f4ea;
      color: #137333;
      font-size: 15px;
      font-weight: 700;
    }

    .complete-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 23px;
      height: 23px;
      border-radius: 50%;
      background: #137333;
      color: #ffffff;
      font-size: 14px;
    }

    /* ========================================
       フェーズ図
    ======================================== */

    .phase-card {
      padding: 25px 24px 27px;
      border: 1px solid #d7e2ec;
      border-radius: 18px;
      background: #ffffff;
      box-shadow:
        0 2px 12px rgba(60, 64, 67, 0.08);
    }

    .phase-title {
      margin: 0 0 20px;
      color: #202124;
      font-size: 17px;
      font-weight: 700;
    }

    .phase-flow {
      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        22px
        minmax(0, 1fr)
        22px
        minmax(0, 1fr)
        22px
        minmax(0, 1fr);
      align-items: start;
      gap: 4px;
    }

    .phase-item {
      position: relative;
      min-width: 0;
      text-align: center;
    }

    .phase-box {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 78px;
      padding: 12px 7px;
      border: 1px solid #dadce0;
      border-radius: 12px;
      background: #f8f9fa;
      color: #5f6368;
      transition:
        background 0.25s ease,
        color 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
    }

    .phase-item.passed .phase-box {
      border-color: #b7d3ef;
      background: #e5f1ff;
      color: #185b94;
    }

    .phase-item.active .phase-box {
      border-color: #1a73e8;
      background: #1a73e8;
      color: #ffffff;
      box-shadow:
        0 3px 10px rgba(26, 115, 232, 0.25);
    }

    .phase-number {
      margin-bottom: 6px;
      font-size: 11px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .phase-name {
      font-size: 14px;
      line-height: 1.45;
      font-weight: 700;
    }

    .phase-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 78px;
      color: #aab0b6;
      font-size: 21px;
    }

    /* ========================================
       現在フェーズ内の進捗
    ======================================== */

    .phase-progress {
      display: none;
      margin-top: 17px;
    }

    .phase-item.active .phase-progress {
      display: block;
    }

    .phase-progress-track {
      position: relative;
      height: 6px;
      margin: 0 7px;
      border-radius: 999px;
      background: #dfe5eb;
    }

    .phase-progress-completed {
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      border-radius: inherit;
      background: #1a73e8;
      transition: width 0.7s ease;
    }

    .phase-progress-marker {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 15px;
      height: 15px;
      border: 3px solid #ffffff;
      border-radius: 50%;
      background: #e04444;
      box-shadow:
        0 1px 4px rgba(0, 0, 0, 0.24);
      transform: translate(-50%, -50%);
      transition: left 0.7s ease;
    }

    .phase-progress-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      color: #7a8793;
      font-size: 10px;
      line-height: 1;
    }

    .phase-current-label {
      margin-top: 11px;
      color: #c93434;
      font-size: 12px;
      line-height: 1.45;
      font-weight: 700;
      text-align: center;
    }

    .phase-current-label-detail {
      color: #596b7a;
      font-weight: 500;
    }

    /* ========================================
       回答本文
    ======================================== */

    .answer-card {
      margin-top: 20px;
      padding: 30px;
      border: 1px solid #dce5ee;
      border-radius: 18px;
      background: #eef6ff;
      color: #174f85;
      box-shadow:
        0 2px 12px rgba(60, 64, 67, 0.07);
      text-align: left;
      font-size: 16px;
      line-height: 1.85;
      overflow-wrap: anywhere;
    }

    .answer-card h2 {
      margin: 28px 0 4px;
      color: #0b4f8a;
      font-size: 18px;
      line-height: 1.55;
    }

    .answer-card h2:first-child {
      margin-top: 0;
    }

    .answer-card p {
      margin: 0;
    }

    .answer-card .answer-gap {
      height: 32px;
    }

    .answer-card a {
      color: #0055a5;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .answer-card a:hover {
      text-decoration-thickness: 2px;
    }

    .error-message {
      padding: 22px;
      border: 1px solid #dadce0;
      border-radius: 16px;
      background: #ffffff;
      color: #5f6368;
      line-height: 1.8;
      text-align: center;
    }

    /* ========================================
       スマホ
    ======================================== */

    @media (max-width: 700px) {
      .page {
        width: min(100% - 20px, 920px);
        padding-top: 8vh;
      }

      .subtitle {
        margin-bottom: 24px;
      }

      .search-row {
        padding-left: 14px;
      }

      .search-shell.expanded #question {
        min-height: 190px;
      }

      .phase-card {
        padding: 20px 13px 24px;
      }

      .phase-flow {
        display: flex;
        align-items: flex-start;
        overflow-x: auto;
        gap: 7px;
        padding: 0 2px 12px;
        scroll-snap-type: x proximity;
      }

      .phase-item {
        flex: 0 0 138px;
        scroll-snap-align: center;
      }

      .phase-arrow {
        flex: 0 0 20px;
      }

      .phase-progress-labels {
        font-size: 9px;
      }

      .answer-card {
        padding: 22px 18px;
        font-size: 15px;
      }
    }
  </style>
</head>

<body translate="no" class="notranslate">
  <main class="page">

    <section class="hero">
      <h1 class="title">恋愛の4フェーズ診断</h1>

      <p class="subtitle">
        うまくいかなかった状況を書くと、<br>
        現在地とボトルネックを構造的に診断します。
      </p>

      <div id="searchShell" class="search-shell">
        <div class="search-row">

          <div class="search-icon" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <circle cx="11" cy="11" r="7"></circle>
              <path d="M20 20L16.2 16.2"></path>
            </svg>
          </div>

          <textarea
            id="question"
            aria-label="相談内容"
            placeholder="例：2回目のデートまでは行けましたが、関係を進めようとすると断られました。会話は盛り上がっていたと思います。"
          ></textarea>

          <button
            id="submitButton"
            class="submit-button"
            type="button"
            aria-label="診断する"

          >
            <svg
              id="submitIcon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.3"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 19V5"></path>
              <path d="M6.5 10.5L12 5L17.5 10.5"></path>
            </svg>

            <span id="submitLoadingIcon" style="display:none;">
              …
            </span>

        </div>
      </div>

      <div class="submit-label">
        相手との関係・具体的な出来事・自分の行動を書くと、判定精度が上がります
      </div>

    <section id="loading" class="loading">
      <div class="loading-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="loading-text">
        深い推論を入れているので、10〜20秒ほどかかる場合があります
      </div>
    </section>

    <section id="resultArea" class="result-area">

      <div class="complete-message">
        <span class="complete-icon">✓</span>
        <span>分析が完了しました。</span>
      </div>

      <section id="phaseCard" class="phase-card">
        <h2 class="phase-title">
          恋愛4フェーズ上の現在地
        </h2>

        <div class="phase-flow">

          <div class="phase-item" data-phase="1">
            <div class="phase-box">
              <div>
                <div class="phase-number">フェーズ1</div>

            </div>

            <div class="phase-progress">
              <div class="phase-progress-track">

              <div class="phase-progress-labels">

              <div>
                <div class="phase-number">フェーズ2</div>

              </div>
            </div>

            <div class="phase-progress">
              <div class="phase-progress-track">
                <div class="phase-progress-completed"></div>
                <div class="phase-progress-marker"></div>
              </div>

              <div class="phase-progress-labels">
                <span>前半</span>
                <span>中盤</span>
                <span>後半</span>
              </div>

              <div class="phase-current-label"></div>
            </div>
          </div>

          <div class="phase-arrow">→</div>

          <div class="phase-item" data-phase="3">
            <div class="phase-box">
              <div>
                <div class="phase-number">フェーズ3</div>
                <div class="phase-name">
                  男としての<br>候補ライン
                </div>
              </div>
            </div>

            <div class="phase-progress">
              <div class="phase-progress-track">
                <div class="phase-progress-completed"></div>
                <div class="phase-progress-marker"></div>
              </div>

              <div class="phase-progress-labels">
                <span>前半</span>
                <span>中盤</span>
                <span>後半</span>
              </div>

              <div class="phase-current-label"></div>
            </div>
          </div>

          <div class="phase-arrow">→</div>

          <div class="phase-item" data-phase="4">
            <div class="phase-box">
              <div>
                <div class="phase-number">フェーズ4</div>

                  長期伴侶<br>ライン
                </div>
              </div>
            </div>

            <div class="phase-progress">
              <div class="phase-progress-track">
                <div class="phase-progress-completed"></div>
                <div class="phase-progress-marker"></div>
              </div>

              <div class="phase-progress-labels">
                <span>前半</span>
                <span>中盤</span>
                <span>後半</span>

      <article id="answerCard" class="answer-card"></article>

  </main>

  <script>
    const API_URL =
      "https://relationship-diagnosis-api.tk-suga3.workers.dev/";

    const searchShell =
      document.getElementById("searchShell");

    const question =
      document.getElementById("question");

    const submitButton =
      document.getElementById("submitButton");

    const submitIcon =
      document.getElementById("submitIcon");

    const submitLoadingIcon =
      document.getElementById("submitLoadingIcon");

    const loading =
      document.getElementById("loading");

    const resultArea =
      document.getElementById("resultArea");

    const phaseCard =
      document.getElementById("phaseCard");

    const answerCard =
      document.getElementById("answerCard");

    let isSubmitting = false;

    /* ========================================
       入力欄
    ======================================== */

    function expandSearch() {
      searchShell.classList.add("expanded");
      resizeTextarea();
    }

    function collapseSearch() {
      if (!question.value.trim()) {
        searchShell.classList.remove("expanded");
        question.style.height = "42px";
        question.style.overflowY = "hidden";
      }
    }

    function resizeTextarea() {
      question.style.height = "auto";

      const minimumHeight =
        searchShell.classList.contains("expanded")
          ? 170
          : 42;

      const nextHeight = Math.max(
        minimumHeight,
        Math.min(question.scrollHeight, 340)
      );

      question.style.height = `${nextHeight}px`;

      question.style.overflowY =
        question.scrollHeight > 340
          ? "auto"
          : "hidden";
    }

    /* ========================================
       診断中
    ======================================== */

    function setLoading(active) {
      isSubmitting = active;

      submitButton.disabled = active;

      submitIcon.style.display =
        active ? "none" : "block";

      submitLoadingIcon.style.display =
        active ? "inline" : "none";

      loading.classList.toggle(
        "visible",
        active
      );
    }

    /* ========================================
       Difyの機械判定行を取得・削除
    ======================================== */

    function extractMachineValues(rawText) {
      const normalizedText = String(rawText || "")
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n")
        .replace(/\u2028/g, "\n")
        .replace(/\u2029/g, "\n")
        .replace(/\u0085/g, "\n");

      const phaseMatch = normalizedText.match(
        /\[\[\s*CURRENT_PHASE\s*:\s*([1-4])\s*\]\]/i
      );

      const progressMatch = normalizedText.match(
        /\[\[\s*PHASE_PROGRESS\s*:\s*(\d{1,3})\s*\]\]/i
      );

      let phase = phaseMatch
        ? Number(phaseMatch[1])
        : null;

      let progress = progressMatch
        ? Number(progressMatch[1])
        : null;

      if (progress !== null) {
        progress = Math.max(
          0,
          Math.min(99, progress)
        );
      }

      /*
        PHASE_PROGRESSがない場合は、
        現在フェーズ内の中盤として扱う
      */
      if (phase !== null && progress === null) {
        progress = 50;
      }

      /*
        CURRENT_PHASEがない場合は、
        本文の「現在地：フェーズ3」などから補完
      */
      if (phase === null) {
        const visiblePhaseMatch =
          normalizedText.match(
            /現在地[：:]\s*フェーズ\s*([1-4])/i
          ) ||
          normalizedText.match(
            /現在のフェーズ[：:]\s*フェーズ\s*([1-4])/i
          );

        if (visiblePhaseMatch) {
          phase = Number(visiblePhaseMatch[1]);
          progress = 50;
        }
      }

      const cleanText = normalizedText
        .replace(
          /\[\[\s*CURRENT_PHASE\s*:\s*[1-4]\s*\]\]/gi,
          ""
        )
        .replace(
          /\[\[\s*PHASE_PROGRESS\s*:\s*\d{1,3}\s*\]\]/gi,
          ""
        )
        .trim();

      return {
        phase,
        progress,
        cleanText
      };
    }

    /* ========================================
       フェーズ図
    ======================================== */

    function getProgressLabel(progress) {
      if (progress <= 30) {
        return "前半";
      }

      if (progress <= 70) {
        return "中盤";
      }

      return "後半";
    }

    function updatePhaseDisplay(phase, progress) {
      const phaseItems =
        document.querySelectorAll(".phase-item");

      phaseItems.forEach((item) => {
        item.classList.remove(
          "active",
          "passed"
        );

        const itemPhase =
          Number(item.dataset.phase);

        if (phase && itemPhase < phase) {
          item.classList.add("passed");
        }

        if (itemPhase === phase) {
          item.classList.add("active");
        }

        const completed =
          item.querySelector(
            ".phase-progress-completed"
          );

        const marker =
          item.querySelector(
            ".phase-progress-marker"
          );

        const label =
          item.querySelector(
            ".phase-current-label"
          );

        if (completed) {
          completed.style.width = "0%";
        }

        if (marker) {
          marker.style.left = "0%";
        }

        if (label) {
          label.innerHTML = "";
        }
      });

      if (![1, 2, 3, 4].includes(phase)) {
        phaseCard.style.display = "none";
        return;
      }

      phaseCard.style.display = "block";

      const safeProgress = Math.max(
        0,
        Math.min(
          99,
          progress === null ||
          progress === undefined
            ? 50
            : Number(progress)
        )
      );

      const progressLabel =
        getProgressLabel(safeProgress);

      const activeItem =
        document.querySelector(
          `.phase-item[data-phase="${phase}"]`
        );

      if (!activeItem) {
        return;
      }

      const completed =
        activeItem.querySelector(
          ".phase-progress-completed"
        );

      const marker =
        activeItem.querySelector(
          ".phase-progress-marker"
        );

      const label =
        activeItem.querySelector(
          ".phase-current-label"
        );

      /*
        0や99では端に寄りすぎるため、
        視認性のため3〜97％に制限
      */
      const markerPosition = Math.max(
        3,
        Math.min(97, safeProgress)
      );

      label.innerHTML =
        `↑ ここで詰まり<br>` +
        `<span class="phase-current-label-detail">` +
        `フェーズ${phase}${progressLabel}` +
        `</span>`;

      requestAnimationFrame(() => {
        completed.style.width =
          `${markerPosition}%`;

        marker.style.left =
          `${markerPosition}%`;
      });

      /*
        スマホでは現在フェーズが見える位置へ
        横スクロールする
      */
      if (window.innerWidth <= 700) {
        setTimeout(() => {
          activeItem.scrollIntoView({
            behavior: "smooth",
            block: "nearest",
            inline: "center"
          });
        }, 150);
      }
    }

    /* ========================================
       HTML安全化・リンク化
    ======================================== */

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function linkify(text) {
      return text.replace(
        /(https?:\/\/[^\s<]+)/g,
        (url) => {
          const cleanUrl = url.replace(
            /[。、，．）」』】]+$/,
            ""
          );

          const trailing =
            url.slice(cleanUrl.length);

          return (
            `<a href="${cleanUrl}" ` +
            `target="_blank" ` +
            `rel="noopener noreferrer">` +
            `${cleanUrl}</a>${trailing}`
          );
        }
      );
    }

    /* ========================================
       回答本文の改行整形
    ======================================== */

    function formatAnswer(rawText) {
  const normalizedText =
    String(rawText || "")
      .replace(/\r\n/g, "\n")
      .replace(/\r/g, "\n")
      .replace(/\u2028/g, "\n")
      .replace(/\u2029/g, "\n")
      .replace(/\u0085/g, "\n");

  const originalLines =
    normalizedText.split("\n");

  const cleanedLines = [];

  originalLines.forEach((originalLine) => {
    const line = originalLine
      .replace(
        /\[\[\s*CTA_START\s*\]\]/gi,
        ""
      )
      .trim();

    if (!line) {
      return;
    }

    /*
      見出しの直前に空白を入れる
    */
    if (/^【[^】]+】$/.test(line)) {
      if (
        cleanedLines.length > 0 &&
        cleanedLines[
          cleanedLines.length - 1
        ] !== ""
      ) {
        cleanedLines.push("");
      }
    }

    cleanedLines.push(line);
  });

  /*
    最後のURLをCTAの末尾と判定する。
    URLの前にある2行をCTAブロックとして、
    その直前に空白を入れる。

    例：
    CTA説明文
    ▼CTA見出し
    URL
  */
  let lastUrlIndex = -1;

  for (
    let index = cleanedLines.length - 1;
    index >= 0;
    index--
  ) {
    if (
      /^https?:\/\/\S+$/i.test(
        cleanedLines[index]
      )
    ) {
      lastUrlIndex = index;
      break;
    }
  }

  if (lastUrlIndex >= 1) {
    const ctaStartIndex =
      Math.max(0, lastUrlIndex - 2);

    if (
      ctaStartIndex > 0 &&
      cleanedLines[
        ctaStartIndex - 1
      ] !== ""
    ) {
      cleanedLines.splice(
        ctaStartIndex,
        0,
        ""
      );
    }
  }

  while (
    cleanedLines.length &&
    cleanedLines[0] === ""
  ) {
    cleanedLines.shift();
  }

  while (
    cleanedLines.length &&
    cleanedLines[
      cleanedLines.length - 1
    ] === ""
  ) {
    cleanedLines.pop();
  }

  const htmlParts = [];

  cleanedLines.forEach((line) => {
    if (line === "") {
      htmlParts.push(
        '<div class="answer-gap"></div>'
      );
      return;
    }

    const headingMatch =
      line.match(/^【([^】]+)】$/);

    if (headingMatch) {
      htmlParts.push(
        `<h2>【${escapeHtml(
          headingMatch[1]
        )}】</h2>`
      );
      return;
    }

    const escapedLine =
      escapeHtml(line);

    htmlParts.push(
      `<p>${linkify(escapedLine)}</p>`
    );
  });

  return htmlParts.join("");
}

    /* ========================================
       エラー表示
    ======================================== */

    function showError(message) {
      resultArea.classList.add("visible");
      phaseCard.style.display = "none";

      answerCard.innerHTML =
        `<div class="error-message">` +
        `${escapeHtml(message)}` +
        `</div>`;
    }

    /* ========================================
       診断送信
    ======================================== */

    async function submitDiagnosis() {
      if (isSubmitting) {
        return;
      }

      const userText =
        question.value.trim();

      if (!userText) {
        question.focus();
        expandSearch();
        return;
      }

      if (userText.length < 20) {
        showError(
          "診断には詳細な情報が必要です。相手との関係、具体的な出来事、自分が取った行動をもう少し詳しく書いてください。"
        );

        resultArea.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });

        return;
      }

      setLoading(true);

      resultArea.classList.remove("visible");
      phaseCard.style.display = "block";
      answerCard.innerHTML = "";

      try {
        const response = await fetch(
          API_URL,
          {
            method: "POST",
            headers: {
              "Content-Type":
                "application/json"
            },
            body: JSON.stringify({
              message: userText
            })
          }
        );

        const data =
          await response.json();

        if (!response.ok) {
          throw new Error(
            data.error ||
            "診断結果の取得に失敗しました。"
          );
        }

        if (!data.answer) {
          throw new Error(
            "診断結果が空でした。"
          );
        }

        const parsed =
          extractMachineValues(
            data.answer
          );

        updatePhaseDisplay(
          parsed.phase,
          parsed.progress
        );

        answerCard.innerHTML =
          formatAnswer(
            parsed.cleanText
          );

        resultArea.classList.add(
          "visible"
        );

        setTimeout(() => {
          resultArea.scrollIntoView({
            behavior: "smooth",
            block: "start"
          });
        }, 100);

      } catch (error) {
        console.error(error);

        showError(
          "診断中にエラーが発生しました。時間をおいて、もう一度お試しください。"
        );

      } finally {
        setLoading(false);
      }
    }

    /* ========================================
       イベント
    ======================================== */

    question.addEventListener(
      "focus",
      expandSearch
    );

    question.addEventListener(
      "blur",
      collapseSearch
    );

    question.addEventListener(
      "input",
      () => {
        expandSearch();
        resizeTextarea();
      }
    );

    question.addEventListener(
      "keydown",
      (event) => {
        /*
          Ctrl＋Enter
          MacはCommand＋Enter
        */
        if (
          event.key === "Enter" &&
          (
            event.ctrlKey ||
            event.metaKey
          )
        ) {
          event.preventDefault();
          submitDiagnosis();
        }
      }
    );

    submitButton.addEventListener(
      "click",
      submitDiagnosis
    );
  </script>
</body>
</html>
